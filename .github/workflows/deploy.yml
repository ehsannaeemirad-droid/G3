name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Only the static site ships: drop dev tooling, platform metadata and
      # personal source documents (Family/Grammar files) from the public artifact.
      - name: Remove dev-only files
        run: rm -rf node_modules .freebuff scripts validate-lessons.mjs package.json package-lock.json Family.docx Family.pdf Grammar.pdf '~$Family.docx'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
